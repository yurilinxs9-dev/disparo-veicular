services:
  disparo:
    build: .
    container_name: disparo
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./dados:/app/dados
      - ./backups:/app/backups
    networks:
      - default
      - evo

networks:
  evo:
    name: evolution_evo-internal
    external: true
